on: push

# Builds with zola-plus (the zola fork with the table directives — see mise.toml
# for the pinned release) instead of a stock zola action.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: 'checkout'
        uses: actions/checkout@v4
      - name: 'setup node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 'guard: no math (site has no renderer)'
        run: node scripts/check-no-math.mjs
      - name: 'install zola-plus (from mise.toml)'
        uses: jdx/mise-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 'build'
        run: zola-plus build

  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 'checkout'
        uses: actions/checkout@v4
      - name: 'setup node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 'guard: no math (site has no renderer)'
        run: node scripts/check-no-math.mjs
      - name: 'install zola-plus (from mise.toml)'
        uses: jdx/mise-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 'build'
        run: zola-plus build
      - name: 'deploy to gh-pages'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
